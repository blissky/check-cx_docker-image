worker_processes auto;
pid /run/check-cx/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    # The gateway is internal; application servers handle user sessions.
    access_log off;
    client_body_temp_path /run/check-cx/client;
    proxy_temp_path /run/check-cx/proxy;
    fastcgi_temp_path /run/check-cx/fastcgi;
    uwsgi_temp_path /run/check-cx/uwsgi;
    scgi_temp_path /run/check-cx/scgi;
    server {
        listen 127.0.0.1:8000;
        server_name _;
        client_max_body_size 10m;
        location /rest/v1/ {
            proxy_pass http://127.0.0.1:3002/;
            proxy_set_header Host $host;
        }
        location /auth/v1/ {
            proxy_pass http://127.0.0.1:9999/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / { return 404; }
    }
}
